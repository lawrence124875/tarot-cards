name: Play 政策檢查（權限與 SDK）

# 建 release AAB（不含私人內容、除錯簽章、測試廣告 ID），輸出 merged manifest 的權限、
# 每個權限來自哪個 SDK、targetSdk／compileSdk。結果寫在 Summary 與 ::notice::（只印權限名與套件名，不印任何金鑰）。
# 正式 AAB 大小以 tarot-content Release 為準（本建置不含解讀與牌圖）。
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/policy_check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 思源黑體／宋體（Google Fonts，OFL）固定在某個 commit，避免上游更新改變字形。
      # 換版本：改 NOTO_COMMIT（並同步改 cache key）。
      - name: 快取字型原檔
        uses: actions/cache@v4
        with:
          path: _fonts_src
          key: noto-tc-sc-jp-kr-th-ar-9710da1e

      - name: 產生字型子集
        env:
          NOTO_COMMIT: 9710da1eacb3be272583c3224dcb70f9da6eadbb
        run: |
          set -euo pipefail
          mkdir -p _fonts_src
          base="https://raw.githubusercontent.com/google/fonts/${NOTO_COMMIT}/ofl"
          [ -s "_fonts_src/NotoSansTC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansTC[wght].ttf" "${base}/notosanstc/NotoSansTC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifTC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifTC[wght].ttf" "${base}/notoseriftc/NotoSerifTC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansSC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansSC[wght].ttf" "${base}/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifSC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifSC[wght].ttf" "${base}/notoserifsc/NotoSerifSC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansJP[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansJP[wght].ttf" "${base}/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifJP[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifJP[wght].ttf" "${base}/notoserifjp/NotoSerifJP%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansKR[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansKR[wght].ttf" "${base}/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifKR[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifKR[wght].ttf" "${base}/notoserifkr/NotoSerifKR%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansThai[wdth,wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansThai[wdth,wght].ttf" "${base}/notosansthai/NotoSansThai%5Bwdth%2Cwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifThai[wdth,wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifThai[wdth,wght].ttf" "${base}/notoserifthai/NotoSerifThai%5Bwdth%2Cwght%5D.ttf"
          [ -s "_fonts_src/NotoSansArabic[wdth,wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansArabic[wdth,wght].ttf" "${base}/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf"
          [ -s "_fonts_src/NotoNaskhArabic[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoNaskhArabic[wght].ttf" "${base}/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf"
          pip install --quiet fonttools==4.62.1
          python3 scripts/build_fonts.py _fonts_src assets/fonts

      - name: 產生 Android 平台資料夾（圖示用空白替代）
        run: |
          mkdir -p branding/android/res
          flutter create --platforms=android --project-name=tarot_cards --org com.lclab .
          rm -f test/widget_test.dart
          bash scripts/patch_android.sh
          bash scripts/patch_firebase.sh
          bash scripts/patch_ads.sh
          flutter pub get

      - name: 建置 AAB（release）
        run: |
          set +e
          flutter build appbundle --release > /tmp/build.log 2>&1
          status=$?
          tail -n 30 /tmp/build.log
          [ $status -ne 0 ] && grep -E "Error|error:|What went wrong" /tmp/build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status

      - name: 權限與 SDK 摘要
        run: |
          bash scripts/permission_report.sh
          grep -q "uses-permission" build/app/outputs/logs/manifest-merger-release-report.txt || { echo "::error::找不到權限"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-report
          path: build/app/outputs/logs/
