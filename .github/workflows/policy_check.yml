name: Play 政策檢查（權限與 SDK）

# 建 release AAB（不含私人內容、除錯簽章、測試廣告 ID），輸出 merged manifest 的權限、
# 每個權限來自哪個 SDK、targetSdk／compileSdk。結果寫在 Summary 與 ::notice::（只印權限名與套件名，不印任何金鑰）。
# 正式 AAB 大小以 tarot-content Release 為準（本建置不含解讀與牌圖）。
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/policy_check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 思源黑體／宋體（Google Fonts，OFL）固定在某個 commit，避免上游更新改變字形。
      # 換版本：改 NOTO_COMMIT（並同步改 cache key）。
      - name: 快取字型原檔
        uses: actions/cache@v4
        with:
          path: _fonts_src
          key: noto-tc-sc-jp-kr-th-ar-9710da1e

      - name: 產生字型子集
        env:
          NOTO_COMMIT: 9710da1eacb3be272583c3224dcb70f9da6eadbb
        run: |
          set -euo pipefail
          mkdir -p _fonts_src
          base="https://raw.githubusercontent.com/google/fonts/${NOTO_COMMIT}/ofl"
          [ -s "_fonts_src/NotoSansTC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansTC[wght].ttf" "${base}/notosanstc/NotoSansTC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifTC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifTC[wght].ttf" "${base}/notoseriftc/NotoSerifTC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansSC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansSC[wght].ttf" "${base}/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifSC[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifSC[wght].ttf" "${base}/notoserifsc/NotoSerifSC%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansJP[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansJP[wght].ttf" "${base}/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifJP[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifJP[wght].ttf" "${base}/notoserifjp/NotoSerifJP%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansKR[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansKR[wght].ttf" "${base}/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifKR[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifKR[wght].ttf" "${base}/notoserifkr/NotoSerifKR%5Bwght%5D.ttf"
          [ -s "_fonts_src/NotoSansThai[wdth,wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansThai[wdth,wght].ttf" "${base}/notosansthai/NotoSansThai%5Bwdth%2Cwght%5D.ttf"
          [ -s "_fonts_src/NotoSerifThai[wdth,wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSerifThai[wdth,wght].ttf" "${base}/notoserifthai/NotoSerifThai%5Bwdth%2Cwght%5D.ttf"
          [ -s "_fonts_src/NotoSansArabic[wdth,wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoSansArabic[wdth,wght].ttf" "${base}/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf"
          [ -s "_fonts_src/NotoNaskhArabic[wght].ttf" ] || curl -fsSL -o "_fonts_src/NotoNaskhArabic[wght].ttf" "${base}/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf"
          pip install --quiet fonttools==4.62.1
          python3 scripts/build_fonts.py _fonts_src assets/fonts

      - name: 產生 Android 平台資料夾（圖示用空白替代）
        run: |
          mkdir -p branding/android/res
          flutter create --platforms=android --project-name=tarot_cards --org com.lclab .
          rm -f test/widget_test.dart
          bash scripts/patch_android.sh
          bash scripts/patch_firebase.sh
          bash scripts/patch_ads.sh
          flutter pub get

      - name: 建置 AAB（release）
        run: |
          set +e
          flutter build appbundle --release > /tmp/build.log 2>&1
          status=$?
          tail -n 30 /tmp/build.log
          [ $status -ne 0 ] && grep -E "Error|error:|What went wrong" /tmp/build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status

      - name: 權限與 SDK 摘要
        run: |
          set -euo pipefail
          set +o pipefail
          aab=$(find build -name '*.aab' -print -quit)
          report=$(find build -name 'manifest-merger-release-report.txt' -print -quit)
          merged=$(find build -path '*merged_manifest*release*' -name AndroidManifest.xml -print -quit)
          [ -n "$merged" ] || merged=$(find build -path '*release*' -path '*merged*' -name AndroidManifest.xml -print -quit)
          [ -n "$aab" ] && [ -n "$report" ] && [ -n "$merged" ] || { find build -name AndroidManifest.xml | sed 's/^/::warning::/' ; echo "::error::找不到 aab/report/merged"; exit 1; }
          echo "aab=$aab report=$report merged=$merged"
          python3 - "$aab" "$report" "$merged" << 'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, re, sys
          aab, report, merged = sys.argv[1:4]
          A = '{http://schemas.android.com/apk/res/android}'
          import xml.etree.ElementTree as ET
          root = ET.parse(merged).getroot()
          sdk = root.find('uses-sdk')
          print('## 基本資料')
          print(f"- compileSdk: {root.get(A+'compileSdkVersion')}")
          print(f"- minSdk: {sdk.get(A+'minSdkVersion') if sdk is not None else '?'} / targetSdk: {sdk.get(A+'targetSdkVersion') if sdk is not None else '?'}")
          print(f"- 本建置 AAB（不含私人內容）: {os.path.getsize(aab)/1e6:.1f} MB")
          # 來源：merger report 中 uses-permission#X 之後的 ADDED from / MERGED from 行
          src = {}
          cur = None
          for line in open(report, encoding='utf-8', errors='replace'):
              m = re.match(r'uses-permission(?:-sdk-23)?#(\S+)', line)
              if m:
                  cur = m.group(1); src.setdefault(cur, set()); continue
              if cur and re.match(r'\S', line) and not line.startswith(('ADDED', 'MERGED', 'INJECTED')):
                  cur = None
              if cur:
                  m2 = re.search(r'(?:ADDED|MERGED) from (\S+)', line)
                  if m2:
                      p = m2.group(1)
                      g = re.search(r'\[([^\]]+)\]', p)
                      if g: name = g.group(1)
                      elif 'src/main/AndroidManifest' in p and '/app/' in p: name = 'App 本身（patch_android.sh）'
                      else:
                          g = re.search(r'/([^/]+)/(?:intermediates|src)/', p)
                          name = ('Flutter 外掛 ' + g.group(1)) if g else p.split('/')[-1]
                      src[cur].add(name)
          print('\n## merged manifest 權限')
          perms = []
          for e in root.iter():
              if e.tag in ('uses-permission', 'uses-permission-sdk-23'):
                  n = e.get(A+'name'); mx = e.get(A+'maxSdkVersion')
                  perms.append(n)
                  s = '、'.join(sorted(src.get(n, []))) or '?'
                  print(f"- {n}{' (maxSdk '+mx+')' if mx else ''} ← {s}")
                  print(f"::notice::PERM {n}{' max'+mx if mx else ''} <- {s}", file=sys.stderr)
          watch = ['ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','ACCESS_BACKGROUND_LOCATION','READ_CONTACTS','WRITE_CONTACTS','GET_ACCOUNTS',
                   'NEARBY_WIFI_DEVICES','ACCESS_LOCAL_NETWORK','READ_CALL_LOG','WRITE_CALL_LOG','READ_SMS','RECEIVE_SMS','SEND_SMS',
                   'MANAGE_EXTERNAL_STORAGE','READ_EXTERNAL_STORAGE','WRITE_EXTERNAL_STORAGE','READ_MEDIA_IMAGES','READ_MEDIA_VIDEO','QUERY_ALL_PACKAGES',
                   'SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','FOREGROUND_SERVICE_MEDIA_PLAYBACK']
          print('\n## 政策關注權限')
          for w in watch:
              hit = [p for p in perms if p.endswith('.'+w)]
              print(f"- {w}: {'有 ← ' + '、'.join(sorted(src.get(hit[0], []))) if hit else '無'}")
          svc = [e.get(A+'permission') for e in root.iter('service') if e.get(A+'permission')]
          acc = [p for p in svc if 'ACCESSIBILITY' in p]
          print(f"- BIND_ACCESSIBILITY_SERVICE（服務）: {'有' if acc else '無'}")
          print(f"::notice::SDK compile={root.get(A+'compileSdkVersion')} target={sdk.get(A+'targetSdkVersion') if sdk is not None else '?'} min={sdk.get(A+'minSdkVersion') if sdk is not None else '?'} aab={os.path.getsize(aab)/1e6:.1f}MB accessibility={'yes' if acc else 'no'} perms={len(perms)}", file=sys.stderr)
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-report
          path: build/app/outputs/logs/
