name: pd_search (temporary)
on:
  push:
    branches: [claude/project-thread-qby2fs]
    paths: ['.github/pd/**', '.github/workflows/pd_search.yml']
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 .github/pd/search.py
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        with:
          name: pd-contact
          path: out/
          retention-days: 1
